name: Notify thast-docs

# Trigger a rebuild of docs.thåst.se whenever this repo's documentation
# changes. The receiving end is FiLORUX/thast-docs, which listens for
# `repository_dispatch` events of type `docs-update` and re-runs the
# sync-and-deploy pipeline against this repo's main branch.

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'LICENSE'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch docs-update event
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/FiLORUX/thast-docs/dispatches" \
            -d '{
              "event_type": "docs-update",
              "client_payload": {
                "source_repo": "${{ github.repository }}",
                "source_sha": "${{ github.sha }}",
                "source_ref": "${{ github.ref }}"
              }
            }'
